<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NARO Biz Responsive Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #d1d5db}.brand{font-weight:800;margin-right:8px}.btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px}.btn.active{background:#111827;color:#fff;border-color:#111827}.meta{margin-left:auto;font-size:12px;color:#6b7280}.stage{min-height:calc(100vh - 55px);padding:18px;overflow:auto;text-align:center}.device{display:inline-block;background:#fff;border:1px solid #9ca3af;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.08);overflow:hidden;vertical-align:top;transition:width .15s ease,height .15s ease}.device iframe{display:block;width:100%;height:100%;border:0;background:#fff}@media(max-width:700px){.meta{width:100%;margin-left:0}.stage{padding:8px}}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">NARO Biz · Responsive Preview</span>
  <button class="btn" data-w="360" data-h="780">Mobile 360</button>
  <button class="btn" data-w="440" data-h="956">Mobile 440</button>
  <button class="btn" data-w="768" data-h="1024">Tablet 768</button>
  <button class="btn" data-w="1032" data-h="1376">Tablet 1032</button>
  <button class="btn active" data-w="1440" data-h="900">Laptop 1440</button>
  <button class="btn" data-w="1920" data-h="1080">Desktop 1920</button>
  <span class="meta" id="meta">1440 × 900 CSS px</span>
</div>
<main class="stage">
  <div class="device" id="device" style="width:1440px;height:900px">
    <iframe src="/" title="NARO Biz isolated preview"></iframe>
  </div>
</main>
<script>
const device=document.getElementById('device');
const meta=document.getElementById('meta');
const buttons=[...document.querySelectorAll('.btn')];
function setViewport(btn){
  const w=Number(btn.dataset.w),h=Number(btn.dataset.h);
  device.style.width=w+'px';device.style.height=h+'px';meta.textContent=w+' × '+h+' CSS px';
  buttons.forEach(b=>b.classList.toggle('active',b===btn));
  device.scrollIntoView({block:'start',inline:'center'});
}
buttons.forEach(btn=>btn.addEventListener('click',()=>setViewport(btn)));
</script>
</body>
</html>
