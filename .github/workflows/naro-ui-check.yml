name: NARO UI rules
on:
  pull_request:
    paths:
      - 'dev/unified-storage/**'
      - 'naro-workspace/outputs/naro-redesign/candidate/**'
      - '.github/workflows/naro-ui-check.yml'
  push:
    branches: [feature/naro-redesign]
    paths:
      - 'dev/unified-storage/**'
      - 'naro-workspace/outputs/naro-redesign/candidate/**'
      - '.github/workflows/naro-ui-check.yml'
permissions:
  contents: read
jobs:
  styles-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/naro-ui-tools" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/naro-ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check all rail destinations in mobile/desktop and light/dark
        run: |
          export NODE_PATH="$RUNNER_TEMP/naro-ui-tools/node_modules"
          test_output="$RUNNER_TEMP/naro-test-output.txt"
          if node --test --test-reporter=spec dev/unified-storage/*.test.mjs > "$test_output" 2>&1; then
            cat "$test_output"
          else
            cat "$test_output"
            TEST_OUTPUT_PATH="$test_output" python3 - <<'PYTHON'
          import os
          from pathlib import Path
          lines = Path(os.environ['TEST_OUTPUT_PATH']).read_text().splitlines()
          message = '\n'.join(lines[-120:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=NARO regression failure::' + message)
          PYTHON
            exit 1
          fi
