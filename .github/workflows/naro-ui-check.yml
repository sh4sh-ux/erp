name: NARO UI rules
on:
  pull_request:
    paths:
      - 'dev/unified-storage/**'
      - 'naro-workspace/outputs/naro-redesign/candidate/**'
      - '.github/workflows/naro-ui-check.yml'
  push:
    branches: [feature/naro-redesign]
    paths:
      - 'dev/unified-storage/**'
      - 'naro-workspace/outputs/naro-redesign/candidate/**'
      - '.github/workflows/naro-ui-check.yml'
permissions:
  contents: read
jobs:
  styles-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/naro-ui-tools" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/naro-ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check all rail destinations in mobile/desktop and light/dark
        run: |
          export NODE_PATH="$RUNNER_TEMP/naro-ui-tools/node_modules"
          node --test dev/unified-storage/*.test.mjs
